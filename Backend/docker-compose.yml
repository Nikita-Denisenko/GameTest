services:
  mysql:
    image: mysql:8.0
    container_name: gametest-mysql
    restart: always

    environment:
      MYSQL_DATABASE: gametest
      MYSQL_USER: gametest
      MYSQL_PASSWORD: gametest_password
      MYSQL_ROOT_PASSWORD: root_password

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql


volumes:
  mysql_data: